name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Tests
        env:
          # Tests mit Apples Texterkennung werden übersprungen, falls Vision auf dem Runner keinen Text liest
          BELEGSUCHE_TEST_VISION_OPTIONAL: "1"
        run: python -m pytest -rs
